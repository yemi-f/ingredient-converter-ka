<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient Converter | Volume to Grams</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <div class="container">
        <header>
            <h1>Volume → Grams</h1>
            <p>Convert volume measurements to weight by ingredient</p>
        </header>

        <div class="no-result" id="noResult">Select an ingredient to begin</div>
        <div class="card">
            <label for="ingredientInput">Ingredient</label>
            <div class="search-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="ingredientInput" placeholder="Search ingredients…" autocomplete="off">
                <button type="button" id="clearBtn" class="clear-btn" aria-label="Clear">&times;</button>
                <div class="dropdown" id="dropdown"></div>
            </div>

            <div class="amount-row">
                <div>
                    <label for="amountInput">Amount</label>
                    <input type="number" id="amountInput" value="1" min="0" step="any">
                </div>
                <div>
                    <label for="unitSelect">Unit</label>
                    <select id="unitSelect">
                        <option value="cup">Cup</option>
                        <option value="tablespoon">Tablespoon</option>
                        <option value="teaspoon">Teaspoon</option>
                        <option value="ml">Milliliter (mL)</option>
                        <option value="liter">Liter (L)</option>
                        <option value="floz">Fluid Ounce</option>
                        <option value="pint">Pint</option>
                        <option value="quart">Quart</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="result" id="result">
            <div class="result-label">Weight</div>
            <div class="result-value" id="resultValue">—</div>
            <div class="result-range" id="resultRange"></div>
            <div class="result-ingredient" id="resultIngredient"></div>
        </div>


        <p class="source-link"><a href="about.html">About</a> <span class="footer-sep">·</span> Ingredient data from <a
                href="https://www.kingarthurbaking.com/learn/ingredient-weight-chart" target="_blank"
                rel="noopener">King Arthur Baking</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fuzzysort@3.1.0/fuzzysort.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/converter.js"></script>
</body>

</html>
